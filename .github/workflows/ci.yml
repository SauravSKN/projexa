name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    name: Backend Tests & Integration
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/projexa_test
      MONGODB_URI_TEST: mongodb://localhost:27017/projexa_test
      JWT_SECRET: projexa-test-secret-value-at-least-32-characters-long
      SESSION_SECRET: projexa-test-secret-value-at-least-32-characters-long
      ALLOW_DEV_SEED: true
      SEED_DEMO_PASSWORD: DevSecretPassword123!

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install Server Dependencies
        run: npm --prefix server install

      - name: Run Backend Tests
        run: npm --prefix server test

  test-frontend:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install Client Dependencies
        run: npm --prefix client install

      - name: Run Client Component Tests
        run: npm --prefix client test

      - name: Build Frontend Bundle
        run: npm --prefix client run build
